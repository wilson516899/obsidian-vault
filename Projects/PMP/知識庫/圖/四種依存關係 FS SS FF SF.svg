<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif">
  <rect width="700" height="400" fill="#fcfcfb"/>

  <text x="24" y="30" font-size="17" font-weight="600" fill="#0b0b0b">四種依存關係：FS／SS／FF／SF</text>
  <text x="24" y="49" font-size="12.5" fill="#52514e">箭頭指的是「哪個時間點觸發哪個時間點」</text>

  <!-- Row FS -->
  <text x="24" y="80" font-size="13" font-weight="600" fill="#0b0b0b">FS</text>
  <text x="24" y="95" font-size="10" fill="#52514e">完成-開始</text>
  <rect x="90" y="65" width="160" height="24" rx="4" fill="#2a78d6"/>
  <text x="170" y="81" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">活動 A</text>
  <rect x="270" y="65" width="160" height="24" rx="4" fill="#eb6834"/>
  <text x="350" y="81" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">活動 B</text>
  <path d="M250,77 L266,77" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="81" font-size="10.5" fill="#52514e">A 完成 → B 才能開始（最常見，預設值）</text>

  <!-- Row SS -->
  <text x="24" y="140" font-size="13" font-weight="600" fill="#0b0b0b">SS</text>
  <text x="24" y="155" font-size="10" fill="#52514e">開始-開始</text>
  <rect x="90" y="125" width="160" height="24" rx="4" fill="#2a78d6"/>
  <text x="170" y="141" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">活動 A</text>
  <rect x="90" y="155" width="140" height="24" rx="4" fill="#eb6834"/>
  <text x="160" y="171" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">活動 B</text>
  <path d="M90,151 L90,153" stroke="#52514e" stroke-width="1.5"/>
  <line x1="90" y1="125" x2="90" y2="179" stroke="#52514e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="440" y="145" font-size="10.5" fill="#52514e">A 開始 → B 才能開始（可同時或平行推進）</text>

  <!-- Row FF -->
  <text x="24" y="215" font-size="13" font-weight="600" fill="#0b0b0b">FF</text>
  <text x="24" y="230" font-size="10" fill="#52514e">完成-完成</text>
  <rect x="90" y="200" width="160" height="24" rx="4" fill="#2a78d6"/>
  <text x="170" y="216" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">活動 A</text>
  <rect x="130" y="230" width="120" height="24" rx="4" fill="#eb6834"/>
  <text x="190" y="246" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">活動 B</text>
  <line x1="250" y1="200" x2="250" y2="254" stroke="#52514e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="440" y="220" font-size="10.5" fill="#52514e">A 完成 → B 才能完成（結束點對齊）</text>

  <!-- Row SF -->
  <text x="24" y="290" font-size="13" font-weight="600" fill="#0b0b0b">SF</text>
  <text x="24" y="305" font-size="10" fill="#52514e">開始-完成</text>
  <rect x="90" y="275" width="160" height="24" rx="4" fill="#eb6834"/>
  <text x="170" y="291" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">活動 A（新班）</text>
  <rect x="20" y="305" width="70" height="24" rx="4" fill="#2a78d6"/>
  <text x="55" y="321" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">活動 B</text>
  <text x="20" y="342" font-size="9.5" fill="#52514e">（舊班）</text>
  <line x1="90" y1="275" x2="90" y2="329" stroke="#52514e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="440" y="295" font-size="10.5" fill="#52514e">A 開始 → B 才能完成（最少見）</text>
  <text x="440" y="311" font-size="10" fill="#52514e">例：新大夜班警衛「到崗」，舊班才「下班」</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#52514e"/>
    </marker>
  </defs>
</svg>
