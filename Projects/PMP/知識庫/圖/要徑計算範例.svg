<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif">
  <rect width="700" height="430" fill="#fcfcfb"/>

  <text x="24" y="32" font-size="17" font-weight="600" fill="#0b0b0b">CPM 網路圖：找出要徑</text>
  <text x="24" y="52" font-size="12.5" fill="#52514e">三條路徑都存在，只有最長的那條是要徑（浮時 = 0）</text>

  <!-- edges (draw first, under nodes) -->
  <g stroke="#c9c8c2" stroke-width="2" fill="none">
    <line x1="90" y1="205" x2="150" y2="130"/>
    <line x1="90" y1="205" x2="150" y2="280"/>
    <line x1="250" y1="130" x2="330" y2="185"/>
    <line x1="250" y1="280" x2="330" y2="215"/>
    <line x1="250" y1="280" x2="330" y2="355"/>
    <line x1="430" y1="200" x2="500" y2="205"/>
    <line x1="430" y1="355" x2="500" y2="215"/>
  </g>
  <!-- critical path B-D-E highlighted -->
  <g stroke="#eb6834" stroke-width="3.5" fill="none">
    <line x1="90" y1="205" x2="150" y2="280"/>
    <line x1="250" y1="280" x2="330" y2="215"/>
    <line x1="430" y1="200" x2="500" y2="205"/>
  </g>

  <!-- Start node -->
  <circle cx="65" cy="205" r="24" fill="#8a8880"/>
  <text x="65" y="210" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">開始</text>

  <!-- A -->
  <rect x="150" y="100" width="100" height="60" rx="6" fill="#c9c8c2"/>
  <text x="200" y="124" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">A</text>
  <text x="200" y="144" font-size="12" fill="#3a3937" text-anchor="middle">8 天</text>

  <!-- C -->
  <rect x="330" y="155" width="100" height="60" rx="6" fill="#c9c8c2"/>
  <text x="380" y="179" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">C</text>
  <text x="380" y="199" font-size="12" fill="#3a3937" text-anchor="middle">1 天</text>

  <!-- B (on critical path) -->
  <rect x="150" y="250" width="100" height="60" rx="6" fill="#2a78d6"/>
  <text x="200" y="274" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">B</text>
  <text x="200" y="294" font-size="12" fill="#ffffff" text-anchor="middle">7 天</text>

  <!-- D (on critical path) -->
  <rect x="330" y="250" width="100" height="60" rx="6" fill="#2a78d6"/>
  <text x="380" y="274" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">D</text>
  <text x="380" y="294" font-size="12" fill="#ffffff" text-anchor="middle">6 天</text>

  <!-- E (merge, on critical path) -->
  <rect x="500" y="175" width="100" height="60" rx="6" fill="#2a78d6"/>
  <text x="550" y="199" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">E</text>
  <text x="550" y="219" font-size="12" fill="#ffffff" text-anchor="middle">7 天</text>

  <!-- F -->
  <rect x="330" y="325" width="100" height="60" rx="6" fill="#c9c8c2"/>
  <text x="380" y="349" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">F</text>
  <text x="380" y="369" font-size="12" fill="#3a3937" text-anchor="middle">2 天</text>

  <!-- Finish -->
  <circle cx="640" cy="205" r="24" fill="#8a8880"/>
  <text x="640" y="210" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">結束</text>
  <line x1="600" y1="205" x2="616" y2="205" stroke="#c9c8c2" stroke-width="2"/>

  <!-- path summaries -->
  <g font-size="12.5">
    <rect x="24" y="380" width="14" height="14" rx="3" fill="#2a78d6"/>
    <text x="44" y="391" fill="#0b0b0b" font-weight="600">要徑 B-D-E ＝ 7+6+7 ＝ 20 天（浮時 0）</text>
  </g>
  <g font-size="12.5" fill="#52514e">
    <text x="330" y="391">A-C-E ＝ 8+1+7 ＝ 16 天（浮時 4 天）</text>
  </g>
  <text x="24" y="412" font-size="12.5" fill="#52514e">B-D-F ＝ 7+6+2 ＝ 15 天（浮時 5 天）—— 常見誤選：只走到 F，忘了 E 才是那條最長路徑真正的終點</text>
</svg>
