<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif">
  <rect width="700" height="380" fill="#fcfcfb"/>

  <text x="24" y="30" font-size="17" font-weight="600" fill="#0b0b0b">管制圖 Control Chart</text>
  <text x="24" y="50" font-size="12.5" fill="#52514e">在管制界限內＝受控（隨機變異）；超界或連續同側＝失控（有可歸咎原因）</text>

  <!-- zone bands -->
  <rect x="70" y="80" width="560" height="200" fill="#2a78d6" opacity="0.05"/>

  <!-- UCL / LCL / mean lines -->
  <line x1="70" y1="90"  x2="630" y2="90"  stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="70" y1="270" x2="630" y2="270" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="70" y1="180" x2="630" y2="180" stroke="#8a8880" stroke-width="1.5" stroke-dasharray="2 3"/>

  <text x="636" y="94"  font-size="11.5" font-weight="600" fill="#eb6834">UCL</text>
  <text x="636" y="274" font-size="11.5" font-weight="600" fill="#eb6834">LCL</text>
  <text x="636" y="184" font-size="11" fill="#52514e">均值 Mean</text>

  <!-- axes -->
  <line x1="70" y1="310" x2="630" y2="310" stroke="#8a8880" stroke-width="1.5"/>
  <line x1="70" y1="60"  x2="70" y2="310" stroke="#8a8880" stroke-width="1.5"/>

  <!-- data points: mostly in control, then a run + an out-of-control point -->
  <polyline points="90,175 120,195 150,160 180,185 210,170 240,150 270,140 300,130 330,120 360,145 390,200 420,215 450,60 480,190 510,200 540,175 570,160 600,180"
            fill="none" stroke="#2a78d6" stroke-width="2"/>
  <g fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5">
    <circle cx="90" cy="175" r="4"/><circle cx="120" cy="195" r="4"/><circle cx="150" cy="160" r="4"/>
    <circle cx="180" cy="185" r="4"/><circle cx="210" cy="170" r="4"/>
    <circle cx="240" cy="150" r="4"/><circle cx="270" cy="140" r="4"/><circle cx="300" cy="130" r="4"/>
    <circle cx="330" cy="120" r="4"/>
    <circle cx="360" cy="145" r="4"/><circle cx="390" cy="200" r="4"/><circle cx="420" cy="215" r="4"/>
    <circle cx="480" cy="190" r="4"/><circle cx="510" cy="200" r="4"/>
    <circle cx="540" cy="175" r="4"/><circle cx="570" cy="160" r="4"/><circle cx="600" cy="180" r="4"/>
  </g>

  <!-- Rule of Seven run (points 240-330, all above mean line trending) -->
  <rect x="228" y="112" width="115" height="46" rx="6" fill="#eb6834" opacity="0.10" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="285" y="105" font-size="11" font-weight="600" fill="#eb6834" text-anchor="middle">連續 7 點同側（Rule of Seven）</text>

  <!-- out of control point -->
  <circle cx="450" cy="60" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="450" y="45" font-size="11.5" font-weight="600" fill="#eb6834" text-anchor="middle">超出 UCL＝失控</text>

  <!-- x axis label -->
  <text x="350" y="335" font-size="11.5" fill="#52514e" text-anchor="middle">每次代碼審查（時間序）</text>
  <text x="24" y="190" font-size="11.5" fill="#52514e" transform="rotate(-90 24 190)" text-anchor="middle">缺陷數</text>

  <text x="24" y="360" font-size="12" fill="#0b0b0b">💡 兩種失控訊號：① 單點超出 UCL/LCL　② 連續 7 點落在均值同一側（即使都在界限內）</text>
</svg>
