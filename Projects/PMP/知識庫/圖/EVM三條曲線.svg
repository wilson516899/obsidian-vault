<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif">
  <rect width="700" height="400" fill="#fcfcfb"/>

  <text x="24" y="30" font-size="17" font-weight="600" fill="#0b0b0b">EVM 三條曲線：PV／EV／AC</text>
  <text x="24" y="50" font-size="12.5" fill="#52514e">本例第 3 個月：AC 在 PV 之下（省錢）、EV 也在 PV 之下（落後）→ 省錢但落後進度</text>

  <!-- grid -->
  <g stroke="#e6e5e1" stroke-width="1">
    <line x1="70" y1="320" x2="620" y2="320"/>
    <line x1="70" y1="260" x2="620" y2="260"/>
    <line x1="70" y1="200" x2="620" y2="200"/>
    <line x1="70" y1="140" x2="620" y2="140"/>
    <line x1="70" y1="80"  x2="620" y2="80"/>
  </g>
  <line x1="70" y1="320" x2="620" y2="320" stroke="#8a8880" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="320" stroke="#8a8880" stroke-width="1.5"/>

  <!-- month 3 vertical marker -->
  <line x1="345" y1="60" x2="345" y2="320" stroke="#c9c8c2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="345" y="48" font-size="11" fill="#52514e" text-anchor="middle">第 3 個月</text>

  <!-- PV curve (planned, smooth to full 450k over 6mo) -->
  <polyline points="70,320 175,282 280,236 345,204 450,150 555,102 620,68"
            fill="none" stroke="#2a78d6" stroke-width="2"/>

  <!-- EV curve (actual % complete: 15,35,45 at mo1-3) -->
  <polyline points="70,320 175,272 280,219 345,196"
            fill="none" stroke="#1baf7a" stroke-width="2"/>

  <!-- AC curve (actual cost cumulative: 80,152,227 at mo1-3, scaled) -->
  <polyline points="70,320 175,265 280,222 345,187"
            fill="none" stroke="#eb6834" stroke-width="2"/>

  <!-- markers at month 3 -->
  <circle cx="345" cy="204" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="345" cy="196" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="345" cy="187" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>

  <!-- direct labels at line end (relief rule for aqua) -->
  <text x="628" y="72" font-size="12" font-weight="600" fill="#2a78d6">PV 計畫值</text>
  <text x="353" y="200" font-size="11.5" font-weight="600" fill="#1baf7a">EV=202.5k</text>
  <text x="353" y="182" font-size="11.5" font-weight="600" fill="#eb6834">AC=227k</text>
  <text x="353" y="219" font-size="11.5" font-weight="600" fill="#2a78d6">PV=225k</text>

  <!-- y axis -->
  <g font-size="11" fill="#52514e" text-anchor="end">
    <text x="62" y="324">$0</text>
    <text x="62" y="264">$150k</text>
    <text x="62" y="204">$300k</text>
    <text x="62" y="84">$450k</text>
  </g>
  <text x="24" y="190" font-size="11.5" fill="#52514e" transform="rotate(-90 24 190)" text-anchor="middle">累計金額</text>

  <!-- x axis -->
  <g font-size="11" fill="#52514e" text-anchor="middle">
    <text x="70" y="340">0</text><text x="175" y="340">1</text>
    <text x="280" y="340">2</text><text x="345" y="340">3</text>
    <text x="450" y="340">4</text><text x="555" y="340">5</text><text x="620" y="340">6 月</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#52514e">
    <line x1="70" y1="365" x2="94" y2="365" stroke="#2a78d6" stroke-width="2"/>
    <text x="100" y="369">PV Planned Value 計畫值</text>
    <line x1="300" y1="365" x2="324" y2="365" stroke="#1baf7a" stroke-width="2"/>
    <text x="330" y="369">EV Earned Value 掙值</text>
    <line x1="500" y1="365" x2="524" y2="365" stroke="#eb6834" stroke-width="2"/>
    <text x="530" y="369">AC Actual Cost 實際成本</text>
  </g>

  <text x="70" y="392" font-size="12" fill="#0b0b0b">💡 EV 低於 PV → 進度落後(SPI&lt;1)；EV 低於 AC → 超支(CPI&lt;1)。三線相對位置直接讀出健康度</text>
</svg>
